name: Check S2MPJ Upstream

on:
  schedule:
    # 07:20 Beijing time, after the daily pinned-snapshot CI.
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned provider snapshot
        uses: actions/checkout@v4

      - name: Fetch and compare the latest upstream subset
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/S2MPJ"
          candidate="$RUNNER_TEMP/candidate"
          report="$RUNNER_TEMP/upstream-update-report.md"

          git clone --depth 1 https://github.com/GrattonToint/S2MPJ.git "$upstream"
          test -d "$upstream/python_problems"
          test -f "$upstream/list_of_python_problems"
          mkdir -p "$candidate"
          cp -R "$upstream/python_problems" "$candidate/python_problems"
          cp "$upstream/list_of_python_problems" "$candidate/list_of_python_problems"

          upstream_commit="$(git -C "$upstream" rev-parse HEAD)"
          upstream_subject="$(git -C "$upstream" show -s --format=%s HEAD)"
          upstream_date="$(git -C "$upstream" show -s --format=%cI HEAD)"
          {
            echo "# S2MPJ Python upstream update report"
            echo
            echo "- Provider commit: \`${GITHUB_SHA}\`"
            echo "- Latest upstream commit: \`${upstream_commit}\`"
            echo "- Latest upstream date: \`${upstream_date}\`"
            echo "- Latest upstream subject: ${upstream_subject}"
            echo
          } > "$report"

          set +e
          diff -qr --exclude=.DS_Store --exclude=__pycache__ --exclude='*.pyc' \
            src/python_problems "$candidate/python_problems" > "$RUNNER_TEMP/tree.diff"
          diff_status=$?
          set -e
          if [ "$diff_status" -gt 1 ]; then
            echo "::error::Managed-tree comparison failed with status $diff_status"
            exit "$diff_status"
          fi

          if [ "$diff_status" = 0 ] \
             && cmp -s src/list_of_python_problems "$candidate/list_of_python_problems"; then
            echo "No managed-file changes were detected." >> "$report"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "A candidate update is available. It has not been applied."
              echo
              echo '```text'
              sed -n '1,300p' "$RUNNER_TEMP/tree.diff"
              difference_count="$(wc -l < "$RUNNER_TEMP/tree.diff" | tr -d ' ')"
              if [ "$difference_count" -gt 300 ]; then
                echo "... file comparison truncated after 300 lines."
              fi
              if ! cmp -s src/list_of_python_problems "$candidate/list_of_python_problems"; then
                echo "Files differ: src/list_of_python_problems"
              fi
              echo '```'
            } >> "$report"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          cp "$report" upstream-update-report.md

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: s2mpj-python-upstream-report
          path: upstream-update-report.md

      - name: Create or update the upstream notification
        uses: actions/github-script@v7
        env:
          UPDATE_AVAILABLE: ${{ steps.audit.outputs.changed }}
        with:
          script: |
            const fs = require("fs");
            const title = "Upstream update available: GrattonToint/S2MPJ";
            const marker = "<!-- optiprofiler-upstream-update:s2mpj-python -->";
            const report = fs.readFileSync("upstream-update-report.md", "utf8");
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title && issue.body?.includes(marker)
            );

            if (process.env.UPDATE_AVAILABLE === "true") {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: "upstream-update" });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name: "upstream-update", color: "FBCA04",
                  description: "A newer upstream snapshot requires maintainer review"
                });
              }
              const body = `${marker}\n${report}\n\nThis workflow is notification-only. Review and promote the snapshot manually.`;
              if (existing) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, body, labels: ["upstream-update"]
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ["upstream-update"]
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "The pinned provider snapshot now matches the managed upstream files. Closing this notification."
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed"
              });
            }
