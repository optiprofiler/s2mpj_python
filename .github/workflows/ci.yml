name: CI

on:
  push:
  pull_request:
  schedule:
    # 07:00 Beijing time.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          # The exact 2.0.0 core this provider release was accepted with.
          ref: ec130fb4e2fd7e59204bc4696d36b30eb2fa9da3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e optiprofiler

      - name: Run adapter smoke and random tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Check source redistribution notices
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/s2mpj-python.zip" HEAD
          python tests/check_distribution.py "$RUNNER_TEMP/s2mpj-python.zip"

      - name: Build core artifacts with the candidate bundled provider
        run: |
          rsync -a --exclude=.git --exclude=.github --exclude=optiprofiler \
            --exclude=tests --exclude=__pycache__ --exclude='*.pyc' \
            ./ optiprofiler/python/optiprofiler/problem_libs/s2mpj/
          python -m pip install build
          python -m build optiprofiler
          python tests/check_distribution.py optiprofiler/dist/*

      - name: Fresh wheel bundled-provider smoke
        shell: bash
        run: |
          python -m pip uninstall -y optiprofiler
          python -m pip install optiprofiler/dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from optiprofiler import list_problem_libraries
          from optiprofiler.problem_libs import s2mpj
          assert 's2mpj' in list_problem_libraries()
          plugin = s2mpj.get_problem_library()
          options = plugin.validate_options(plugin.get_default_options())
          assert 'ROSENBR' in plugin.select({'ptype': 'u', 'maxdim': 2}, options)
          p = plugin.load('HS13', options)
          np.testing.assert_allclose(p.hcub(p.x0)[0], np.diag([-18, 0]))
          root = Path(s2mpj.__file__).parent
          assert (root / 'LICENCE.txt').is_file()
          assert (root / 'THIRD_PARTY_NOTICES.md').is_file()
          PY

      - name: Run the OptiProfiler 2.0 contract test on the bundled provider
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          OP_TEST_V2=1 python "$GITHUB_WORKSPACE/tests/test_v2_contract.py"
